<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Resume</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar custom-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Resume Analyzer</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="upload-card">
        <h3 class="text-center mb-3">Upload Your Resume</h3>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" class="form-control mb-3 mx-auto" style="width: 60%;"  name="resume" accept=".pdf" required>
            <button class="btn btn-primary mx-auto" style="width: 30%; display: block;">Analyze Resume</button>
        </form>
    </div>
</div>

</body>
</html>
