<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar custom-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Resume Analyzer</a>
    </div>
</nav>

<div class="container mt-5 text-center">
    <div class="result-card">
        <h3>Resume Strength</h3>
        <h4 class="mt-3 ">Score: {{ score }} / 100</h4>
        <div class="progress mt-3 mx-auto" style="height: 35px;width: 50%;">
            <div class="progress-bar bg-dark" role="progressbar"
                style="width: {{ score }}%;"
                aria-valuenow="{{ score }}"
                aria-valuemin="0"
                aria-valuemax="100">
                {{ score }}%
            </div>
        </div>
        <h5 class="mt-4">Strength: {{ strength }}</h5>

        <p class="mt-3">{{ message }}</p>
        <a href="/upload" class="btn btn-custom-outline mt-3">
            Analyze Another Resume
        </a>
    </div>
</div>

</body>
</html>
